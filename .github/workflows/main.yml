name: ZXP Release

on:
  push:
    tags:
      - "spunkram-*.*.*"
      - "gal-*.*.*"
      - "odin-*.*.*"
      - "*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        node-version: [18.x]
    steps:
      - uses: actions/checkout@v2
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node-version }}
      - name: Resolve brand from tag
        id: brand
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -like "gal-*") {
            Add-Content -Path $env:GITHUB_OUTPUT -Value "id=gal"
          } elseif ($tag -like "odin-*") {
            Add-Content -Path $env:GITHUB_OUTPUT -Value "id=odin"
          } else {
            Add-Content -Path $env:GITHUB_OUTPUT -Value "id=spunkram"
          }
      - run: npm i --legacy-peer-deps
      - run: npm run build -- --author=${{ steps.brand.outputs.id }} --format=zxp

      - name: GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_NAME: ${{ steps.extract_names.outputs.SOURCE_NAME }}
          SOURCE_BRANCH: ${{ steps.extract_names.outputs.SOURCE_BRANCH }}
          SOURCE_TAG: ${{ steps.extract_names.outputs.SOURCE_TAG }}
        with:
          files: "./dist/zxp/*"
