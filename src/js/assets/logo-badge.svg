<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Spunkram">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <mask id="mark" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
      <image
        xlink:href="data:image/png;base64,"
        href="data:image/png;base64,"
        x="26"
        y="36"
        width="76"
        height="56"
        preserveAspectRatio="xMidYMid meet"
      />
    </mask>
  </defs>
  <circle cx="64" cy="64" r="48" fill="#7c4dff" opacity="0.45" filter="url(#glow)" />
  <circle cx="64" cy="64" r="44" fill="#7c4dff" />
  <rect x="0" y="0" width="128" height="128" fill="#ffffff" mask="url(#mark)" />
</svg>
